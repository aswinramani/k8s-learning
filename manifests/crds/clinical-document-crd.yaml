apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clinicaldocuments.healthcare.io
spec:
  group: healthcare.io
  scope: Namespaced
  names:
    plural: clinicaldocuments
    singular: clinicaldocument
    kind: ClinicalDocument
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec: 
            type: object
            properties:
              patientId:
                type: string
              documentType:
                type: string
              status:
                type: string
